services:
  fr5-sim:
    build: .
    image: fr5_ros2:latest
    container_name: fr5_ros2_sim
    # network_mode host: evita todo el lio de configurar DDS/rosbridge a traves
    # de NAT y le permite al contenedor llegar directo a la red donde esta
    # Unity (o el controlador real, en el otro servicio). Solo funciona en
    # hosts Linux; en Docker Desktop (Mac/Windows) sacar esta linea y usar el
    # bloque "ports" comentado mas abajo.
    network_mode: host
    # ports:
    #   - "9090:9090"
    environment:
      - ROS_DOMAIN_ID=0
    command: ["ros2", "launch", "an5_mock_sim", "sim.launch.py"]

  fr5-real:
    build: .
    image: fr5_ros2:latest
    container_name: fr5_ros2_real
    # Modo real: el controlador FR5/AN5 esta hardcodeado en 192.168.58.2, asi
    # que el contenedor necesita estar en esa misma red -- de nuevo, mas
    # simple con network_mode host.
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
    command: ["ros2", "launch", "an5_mock_sim", "real.launch.py"]
    profiles: ["real"]
